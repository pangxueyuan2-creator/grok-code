name: Feature request
description: Propose an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What friction or missing capability are you hitting?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it behave from a normal user's point of view?
    validations:
      required: true
  - type: checkboxes
    id: beginner
    attributes:
      label: Beginner by default
      description: Should this stay hidden until Pro Mode, or be visible to everyone?
      options:
        - label: Visible in Simple Mode
        - label: Pro Mode only
