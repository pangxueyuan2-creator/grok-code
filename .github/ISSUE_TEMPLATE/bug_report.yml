name: Bug report
description: Report a reproducible problem
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please include enough
        detail for us to reproduce it.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do and what did you observe?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Grok Code version
      placeholder: "e.g. 0.1.0-dev (git sha)"
  - type: input
    id: grok-version
    attributes:
      label: Grok Build version
      placeholder: "e.g. grok 1.0.4"
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: ["Windows", "macOS", "Linux"]
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
